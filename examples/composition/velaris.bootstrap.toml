# target_environment.endpoints.api is the single source of truth for base_url.
# Bootstrap convention copies it into api.options before resolution.
# Test declares only api + secrets.

[capabilities.api]
provider = "requests"

[capabilities.secrets]
provider = "static"

[capabilities.secrets.options]
values = { API_TOKEN = "compose-token" }

[capabilities.target_environment]
provider = "static"

[capabilities.target_environment.options]
environment = "local"
endpoints = { api = "http://testserver" }
