# All three capabilities bound. api.options.base_url intentionally omitted —
# test code reads the URL from target_environment directly.

[capabilities.api]
provider = "requests"

[capabilities.secrets]
provider = "static"

[capabilities.secrets.options]
values = { API_TOKEN = "compose-token" }

[capabilities.target_environment]
provider = "static"

[capabilities.target_environment.options]
environment = "local"
endpoints = { api = "http://testserver" }
