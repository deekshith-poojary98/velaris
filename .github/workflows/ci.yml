name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e packages/velaris-contracts -e "packages/velaris-core[dev]"
      - name: Lint
        run: ruff check packages/velaris-core packages/velaris-contracts
      - name: Tests
        run: pytest -q
