[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velaris-contracts"
version = "0.1.0"
description = "Versioned capability contracts for Velaris"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Deekshith Poojary", email = "deekshithpoojary355@gmail.com" },
]
keywords = ["velaris", "testing", "capabilities", "contracts", "protocols"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Repository = "https://github.com/deekshith-poojary98/velaris"
Documentation = "https://github.com/deekshith-poojary98/velaris#readme"

[tool.hatch.build.targets.wheel]
packages = ["velaris_contracts"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
    "build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
