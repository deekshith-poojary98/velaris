[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velaris-contracts"
version = "0.1.0"
description = "Versioned capability contracts for Velaris"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["velaris_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
