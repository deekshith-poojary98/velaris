[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velaris-core"
version = "0.1.0"
description = "Velaris capability registry, resolver, and test execution engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Deekshith Poojary", email = "deekshithpoojary355@gmail.com" },
]
keywords = ["velaris", "testing", "cli", "capabilities", "integration-testing", "test-runner", "plugins"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "velaris-contracts",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
velaris = "velaris_core.cli:main"

[project.urls]
Repository = "https://github.com/deekshith-poojary98/velaris"
Documentation = "https://github.com/deekshith-poojary98/velaris#readme"

[tool.hatch.build.targets.wheel]
packages = ["velaris_core"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff",
    "build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
